<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F2EDE4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vessel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5C42"/>
      <stop offset="40%" stop-color="#A57051"/>
      <stop offset="60%" stop-color="#A57051"/>
      <stop offset="100%" stop-color="#8A5C42"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B3A1F"/>
      <stop offset="40%" stop-color="#A0522D"/>
      <stop offset="60%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#6B3A1F"/>
    </linearGradient>
    <linearGradient id="oil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7220"/>
      <stop offset="40%" stop-color="#D9A536"/>
      <stop offset="60%" stop-color="#D9A536"/>
      <stop offset="100%" stop-color="#9A7220"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#F2EDE4"/>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- Apothecary jar -->
  <g transform="translate(400 410)">
    <ellipse cx="0" cy="220" rx="180" ry="14" fill="#6B4A35" opacity="0.12"/>

    <!-- jar body -->
    <path d="M -160 -50 Q -160 -210 -130 -210 L 130 -210 Q 160 -210 160 -50 L 160 180 Q 160 220 120 220 L -120 220 Q -160 220 -160 180 Z"
          fill="url(#vessel)"/>

    <!-- subtle glass shine -->
    <path d="M -130 -50 Q -130 -180 -110 -180 L -90 -180 L -90 180 Q -90 200 -110 200 L -130 200 Z"
          fill="#FFFFFF" opacity="0.12"/>

    <!-- cream label -->
    <rect x="-140" y="0" width="280" height="130" fill="#FAF6F0"/>
    <line x1="-120" y1="20" x2="120" y2="20" stroke="#A57051" stroke-width="2"/>
    <line x1="-120" y1="110" x2="120" y2="110" stroke="#A57051" stroke-width="2"/>

    <!-- mustard rule on label -->
    <line x1="-30" y1="65" x2="30" y2="65" stroke="#D9A536" stroke-width="3"/>

    <!-- lid -->
    <rect x="-145" y="-245" width="290" height="40" rx="6" fill="#6B4A35"/>
    <rect x="-150" y="-228" width="300" height="18" rx="4" fill="#9A7C62"/>

    <!-- mustard rim band -->
    <rect x="-160" y="-58" width="320" height="6" fill="#D9A536"/>
  </g>

  <text x="400" y="700" text-anchor="middle"
        font-family="Georgia, 'Liberation Serif', serif"
        font-size="42" font-weight="600" fill="#6B4A35">Avipattikar Churna</text>
  <text x="400" y="745" text-anchor="middle"
        font-family="Georgia, 'Liberation Serif', serif"
        font-size="18" font-style="italic" fill="#9A7C62"
        letter-spacing="3">CHURNA</text>
  <line x1="370" y1="765" x2="430" y2="765" stroke="#A57051" stroke-width="2"/>
</svg>