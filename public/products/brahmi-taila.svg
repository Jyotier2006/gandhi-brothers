<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F2EDE4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vessel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5C42"/>
      <stop offset="40%" stop-color="#A57051"/>
      <stop offset="60%" stop-color="#A57051"/>
      <stop offset="100%" stop-color="#8A5C42"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B3A1F"/>
      <stop offset="40%" stop-color="#A0522D"/>
      <stop offset="60%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#6B3A1F"/>
    </linearGradient>
    <linearGradient id="oil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7220"/>
      <stop offset="40%" stop-color="#D9A536"/>
      <stop offset="60%" stop-color="#D9A536"/>
      <stop offset="100%" stop-color="#9A7220"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#F2EDE4"/>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400 420)">
    <ellipse cx="0" cy="240" rx="120" ry="11" fill="#6B4A35" opacity="0.12"/>

    <!-- neck -->
    <rect x="-22" y="-275" width="44" height="60" fill="#8A5C42"/>

    <!-- shoulder -->
    <path d="M -90 -200 Q -90 -225 -28 -225 L 28 -225 Q 90 -225 90 -200 Z"
          fill="url(#oil)"/>

    <!-- body (slim oil bottle) -->
    <rect x="-90" y="-200" width="180" height="430" rx="10" fill="url(#oil)"/>

    <!-- shine -->
    <rect x="-72" y="-200" width="14" height="410" rx="7" fill="#FFFFFF" opacity="0.20"/>

    <!-- cork-style cap -->
    <rect x="-26" y="-285" width="52" height="14" rx="2" fill="#6B4A35"/>
    <rect x="-22" y="-275" width="44" height="6" fill="#9A7C62"/>

    <!-- label -->
    <rect x="-78" y="-60" width="156" height="200" fill="#FAF6F0"/>
    <line x1="-62" y1="-35" x2="62" y2="-35" stroke="#A57051" stroke-width="2"/>
    <line x1="-62" y1="115" x2="62" y2="115" stroke="#A57051" stroke-width="2"/>

    <!-- leaf glyph -->
    <g transform="translate(0 50)" fill="#A57051">
      <path d="M 0 -25 Q 22 -10 22 10 Q 0 25 -22 10 Q -22 -10 0 -25 Z"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#FAF6F0" stroke-width="1.5"/>
    </g>
  </g>

  <text x="400" y="700" text-anchor="middle"
        font-family="Georgia, 'Liberation Serif', serif"
        font-size="42" font-weight="600" fill="#6B4A35">Brahmi Taila</text>
  <text x="400" y="745" text-anchor="middle"
        font-family="Georgia, 'Liberation Serif', serif"
        font-size="18" font-style="italic" fill="#9A7C62"
        letter-spacing="3">TAILA</text>
  <line x1="370" y1="765" x2="430" y2="765" stroke="#A57051" stroke-width="2"/>
</svg>