<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F2EDE4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vessel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5C42"/>
      <stop offset="40%" stop-color="#A57051"/>
      <stop offset="60%" stop-color="#A57051"/>
      <stop offset="100%" stop-color="#8A5C42"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B3A1F"/>
      <stop offset="40%" stop-color="#A0522D"/>
      <stop offset="60%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#6B3A1F"/>
    </linearGradient>
    <linearGradient id="oil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7220"/>
      <stop offset="40%" stop-color="#D9A536"/>
      <stop offset="60%" stop-color="#D9A536"/>
      <stop offset="100%" stop-color="#9A7220"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#F2EDE4"/>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400 420)">
    <ellipse cx="0" cy="240" rx="150" ry="12" fill="#6B4A35" opacity="0.12"/>

    <!-- shoulder -->
    <path d="M -120 -150 Q -120 -200 -80 -210 L 80 -210 Q 120 -200 120 -150 Z"
          fill="url(#vessel)"/>

    <!-- body -->
    <rect x="-120" y="-150" width="240" height="380" rx="18" fill="url(#vessel)"/>

    <!-- highlight -->
    <rect x="-95" y="-150" width="22" height="360" rx="11" fill="#FFFFFF" opacity="0.14"/>

    <!-- cap -->
    <rect x="-72" y="-240" width="144" height="40" rx="6" fill="#6B4A35"/>
    <rect x="-66" y="-244" width="132" height="6" fill="#9A7C62"/>

    <!-- label -->
    <rect x="-110" y="-30" width="220" height="190" fill="#FAF6F0"/>
    <line x1="-90" y1="-5" x2="90" y2="-5" stroke="#A57051" stroke-width="2"/>
    <line x1="-90" y1="135" x2="90" y2="135" stroke="#A57051" stroke-width="2"/>

    <!-- capsule pictogram -->
    <g transform="translate(0 75)">
      <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#D9A536"/>
      <rect x="-44" y="-14" width="44" height="28" rx="14" fill="#C28F6E"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#6B4A35" stroke-width="1" opacity="0.3"/>
    </g>
  </g>

  <text x="400" y="700" text-anchor="middle"
        font-family="Georgia, 'Liberation Serif', serif"
        font-size="42" font-weight="600" fill="#6B4A35">Ashwagandha Capsules</text>
  <text x="400" y="745" text-anchor="middle"
        font-family="Georgia, 'Liberation Serif', serif"
        font-size="18" font-style="italic" fill="#9A7C62"
        letter-spacing="3">CAPSULE</text>
  <line x1="370" y1="765" x2="430" y2="765" stroke="#A57051" stroke-width="2"/>
</svg>